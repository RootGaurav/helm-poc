app: poc-node-app
envName: dev
replicaCount: 1

image:
  repository: poc-node-app
  pullPolicy: Never
  tag: "dev-latest"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

envVariables:
  - name: PORT
    value: "3000"
  - name: ENV
    value: "dev"
  - name: APP_VERSION
    value: "1.0.0"

service:
  type: NodePort
  port: 80
  container_port: 3000

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

autoscaling:
  enabled: false

volumes:
  - name: logs
    emptyDir: {}

volumeMounts:
  - name: logs
    mountPath: "/opt/logs/"
    readOnly: false

ingress:
  enabled: false
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
